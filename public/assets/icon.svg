<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orbe" cx="42%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#e0c898"/>
      <stop offset="60%" stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#7a6030"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="60" fill="url(#bg)"/>

  <!-- Borde dorado -->
  <rect x="16" y="16" width="480" height="480" rx="48" fill="none"
        stroke="rgba(200,169,110,0.35)" stroke-width="2.5"/>

  <!-- Orbe con glow -->
  <circle cx="256" cy="220" r="105" fill="url(#orbe)" filter="url(#glow)"/>

  <!-- Iniciales PR -->
  <text x="256" y="238" text-anchor="middle" font-family="Georgia, serif"
        font-size="82" font-weight="bold" fill="#1a1408">PR</text>

  <!-- LA POSADA -->
  <text x="256" y="380" text-anchor="middle" font-family="Georgia, serif"
        font-size="36" fill="rgba(200,169,110,0.75)" letter-spacing="3">LA POSADA</text>

  <!-- DE RUBA -->
  <text x="256" y="415" text-anchor="middle" font-family="Georgia, serif"
        font-size="22" fill="rgba(200,169,110,0.45)" letter-spacing="4">DE RUBA</text>
</svg>
